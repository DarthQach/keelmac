name: KeelMac
options:
  bundleIdPrefix: mx.cvillegas
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  SafetyKit:
    path: Packages/SafetyKit
  InsightsKit:
    path: Packages/InsightsKit
  MaintenanceKit:
    path: Packages/MaintenanceKit
  MetricsKit:
    path: Packages/MetricsKit
  ScanKit:
    path: Packages/ScanKit
  CleanKit:
    path: Packages/CleanKit
  AppsKit:
    path: Packages/AppsKit
  AssistantKit:
    path: Packages/AssistantKit
targets:
  KeelMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Config/mx.cvillegas.keelmac.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: KeelMacHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: MaintenanceKit
        product: MaintenanceKit
      - package: MaintenanceKit
        product: HelperShared
      - package: Sparkle
      - package: SafetyKit
      - package: MetricsKit
      - package: ScanKit
      - package: CleanKit
      - package: AppsKit
      - package: AssistantKit
      - package: InsightsKit
        product: DuplicatesKit
      - package: InsightsKit
        product: ReportKit
    entitlements:
      path: Config/KeelMac.entitlements
      properties: {}
    info:
      path: Config/Info-App.plist
      properties:
        CFBundleDisplayName: KeelMac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, es]
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "KeelMac is free software under the GPL-3.0 licence."
        CFBundleURLTypes:
          - CFBundleURLName: mx.cvillegas.keelmac
            CFBundleURLSchemes: [keelmac]
        SUFeedURL: https://keelmac.flowrunnerapp.workers.dev/appcast.xml
        SUPublicEDKey: 05JtLdY4xboQcV61MR76UJIg7n4IrbhoLZyxbrsR9Dw=
        SUEnableSystemProfiling: false
        SUEnableInstallerLauncherService: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.cvillegas.keelmac
        PRODUCT_NAME: KeelMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "KeelMac is free software under the GPL-3.0 licence."
        COMBINE_HIDPI_IMAGES: YES
  KeelMacHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: [Info.plist]
    dependencies:
      - package: MaintenanceKit
        product: HelperCore
      - package: MaintenanceKit
        product: HelperShared
    settings:
      base:
        PRODUCT_NAME: KeelMacHelper
        PRODUCT_BUNDLE_IDENTIFIER: mx.cvillegas.keelmac.helper
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: Helper/Info.plist
        SKIP_INSTALL: YES
  KeelMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KeelMacTests
    dependencies:
      - target: KeelMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.cvillegas.keelmac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KeelMac.app/Contents/MacOS/KeelMac
        BUNDLE_LOADER: $(TEST_HOST)
  KeelMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/KeelMacUITests
    dependencies:
      - target: KeelMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.cvillegas.keelmac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KeelMac
schemes:
  KeelMac:
    build:
      targets:
        KeelMac: all
        KeelMacTests: [test]
        KeelMacUITests: [test]
    test:
      targets:
        - KeelMacTests
        - KeelMacUITests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
