name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Build, sign, notarize, package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="${{ github.run_number }}"
          xcodegen generate && xcodebuild -resolvePackageDependencies -project KeelMac.xcodeproj -scheme KeelMac -derivedDataPath build/DerivedData
          bash scripts/release.sh "$VERSION" "$BUILD" "See the release notes on the website."
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/KeelMac-*.dmg --title "KeelMac ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
      - name: Commit appcast, release list and cask
        run: |
          git config user.name "keelmac-release"
          git config user.email "keelmac-release@users.noreply.github.com"
          git add site/releases.json site/public Casks/keelmac.rb
          git commit -m "chore(release): ${GITHUB_REF_NAME}" && git push origin HEAD:main
      - name: Deploy site and appcast
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd site && npm ci && npx wrangler deploy
